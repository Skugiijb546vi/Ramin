name: Build Godot Android APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # ئەمە ڕێگەت پێدەدات بە دەستی (Manual) بیڵدەکە ئیش پێ بکەیت

jobs:
  export-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export for Android
        uses: firebelley/godot-export@master
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          relative_project_path: ./3d/truck_town
          archive_output: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckTown-Android-APK
          path: /home/runner/.local/share/godot/archives/
